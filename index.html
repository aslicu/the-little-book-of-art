<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Little Book of Art</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet"
  >

  <style>
    ::-webkit-scrollbar {
      display: none;
    }

    body {
      background-color: #0a0a0c;
      background-image:
        radial-gradient(circle at center, #1a1a2e 0%, #0a0a0c 100%);
      font-family: 'Lora', serif;
    }

    .magical-glow {
      box-shadow:
        0 0 40px rgba(0, 0, 0, 0.8),
        0 0 20px rgba(197, 160, 89, 0.05);
    }

    .title-font {
      font-family: 'Cinzel', serif;
    }

    .gold-text {
      color: #c5a059;
    }

    .ornament {
      position: relative;
      border: 1px solid rgba(197, 160, 89, 0.2);
      padding: 10px;
    }

    .art-tag {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;

      border: 1px solid rgba(197, 160, 89, 0.25);
      background-color: rgba(197, 160, 89, 0.05);

      color: #cfc6b4;
      font-size: 0.75rem;
      line-height: 1rem;
      letter-spacing: 0.08em;

      border-radius: 9999px;
    }

    .art-tag.hidden {
      display: none;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center p-8 text-neutral-200">

  <header class="text-center mb-16">
    <h1
      class="title-font text-4xl tracking-[0.1em] gold-text opacity-90 mb-2"
    >
      The Little Book of Art
    </h1>

    <div
      class="w-32 h-[1px] bg-gradient-to-r from-transparent via-[#c5a059] to-transparent mx-auto opacity-50"
    ></div>
  </header>

  <main
    class="w-full max-w-6xl flex flex-col md:flex-row gap-16 items-center justify-center"
  >

    <!-- ESER GÖRSELİ -->
    <div
      class="w-full md:w-3/5 ornament magical-glow bg-[#0d0d11] rounded-sm transition-all duration-700"
    >
      <div
        class="aspect-[4/5] md:aspect-auto md:h-[65vh] flex items-center justify-center overflow-hidden bg-black shadow-inner"
      >
        <img
          id="artwork-display"
          src=""
          alt="Sanat Eseri"
          class="max-w-full max-h-full object-contain transition-opacity duration-1000 opacity-0"
        >
      </div>
    </div>

    <!-- ESER BİLGİLERİ -->
    <div class="w-full md:w-2/5 flex flex-col gap-8">

      <div class="flex flex-col gap-4">

        <h2
          id="art-title"
          class="title-font text-3xl font-bold leading-tight gold-text tracking-wide border-b border-neutral-800 pb-4"
        >
          Yükleniyor…
        </h2>

        <p
          id="art-artist"
          class="text-neutral-400 text-lg italic tracking-wider font-medium"
        ></p>

        <!-- MİLLİYET, TARİH VE MÜZE ETİKETLERİ -->
        <div
          id="art-tags"
          class="flex flex-wrap gap-2 pt-1"
        >
          <span
            id="nationality-tag"
            class="art-tag hidden"
          ></span>

          <span
            id="date-tag"
            class="art-tag hidden"
          ></span>

          <span
            id="museum-tag"
            class="art-tag hidden"
          ></span>
        </div>

      </div>

      <div class="relative py-2">
        <p
          id="art-desc"
          class="text-neutral-300 leading-relaxed text-lg font-normal tracking-wide text-justify"
        >
          Açıklama yükleniyor...
        </p>
      </div>

      <div class="mt-4">
        <button
          id="next-btn"
          class="group flex flex-col items-start w-max gap-3 transition-all duration-500"
        >
          <span
            class="title-font text-xl tracking-[0.4em] uppercase gold-text group-hover:text-white transition-colors"
          >
            Next ✨
          </span>

          <div
            class="relative w-24 h-[1px] bg-neutral-800 overflow-hidden"
          >
            <div
              class="absolute inset-0 bg-[#c5a059] translate-x-[-100%] group-hover:translate-x-[0%] transition-transform duration-700"
            ></div>
          </div>
        </button>
      </div>

    </div>
  </main>

  <footer
    class="mt-20 opacity-20 title-font text-[10px] tracking-[0.4em] uppercase"
  >
    The Little Book of Art Project
  </footer>

  <script>
    /*
      FIREBASE HOSTING ANA ADRESİ
    */
    const FIREBASE_ROOT =
      'https://the-little-book-of-art.web.app';

    /*
      KOLEKSİYON JSON DOSYASI
    */
    const JSON_URL =
      `${FIREBASE_ROOT}/data/fuer_juli.json`;

    /*
      HTML ELEMANLARI
    */
    const imgElement =
      document.getElementById('artwork-display');

    const titleElement =
      document.getElementById('art-title');

    const artistElement =
      document.getElementById('art-artist');

    const descElement =
      document.getElementById('art-desc');

    const nationalityTag =
      document.getElementById('nationality-tag');

    const dateTag =
      document.getElementById('date-tag');

    const museumTag =
      document.getElementById('museum-tag');

    const nextBtn =
      document.getElementById('next-btn');

    /*
      KOLEKSİYON VERİLERİ
    */
    let artworks = [];
    let lastIndex = -1;

    /*
      BİRDEN FAZLA ALANDAN İLK DOLU OLANI BULUR
    */
    function firstAvailable(...values) {
      for (const value of values) {
        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ''
        ) {
          return String(value).trim();
        }
      }

      return '';
    }

    /*
      ESER BAŞLIĞI
    */
    function getTitle(item) {
      return firstAvailable(
        item.title_tr,
        item.title,
        item.title_en,
        'İsimsiz Eser'
      );
    }

    /*
      SANATÇI
    */
    function getArtist(item) {
      return firstAvailable(
        item.artist,
        item.artist_name,
        item.creator,
        'Sanatçı bilinmiyor'
      );
    }

    /*
      TÜRKÇE AÇIKLAMA
    */
    function getDescription(item) {
      return firstAvailable(
        item.ours_description_tr,
        item.description_tr,
        item.description,
        item.ours_description_en,
        item.description_en,
        'Bu eser için henüz bir açıklama bulunmuyor.'
      );
    }

    /*
      SANATÇI MİLLİYETİ
    */
    function getNationality(item) {
      return firstAvailable(
        item.artist_nationality_tr,
        item.artist_nationality,
        item.artist_nationality_en,
        item.nationality_tr,
        item.nationality,
        item.culture_tr,
        item.culture
      );
    }

    /*
      ESER TARİHİ
    */
    function getDate(item) {
      return firstAvailable(
        item.date,
        item.year,
        item.object_date,
        item.creation_date
      );
    }

    /*
      MÜZE ADI
    */
    function getMuseum(item) {
      return firstAvailable(
        item.museum_name_tr,
        item.museum_name,
        item.museum_name_en,
        item.museum,
        item.institution
      );
    }

    /*
      ESER KİMLİĞİ

      Öncelikle museum_object_id kullanılır.
      Çünkü görsel dosyasının adı genellikle bu kimliktir.
    */
    function getArtworkId(item) {
      return firstAvailable(
        item.museum_object_id,
        item.object_id,
        item.objectID,
        item.source_item_id,
        item.sourceItemId,
        item.id,
        item.key
      );
    }

    /*
      MÜZE KLASÖR ADINI BULUR

      Firebase Hosting örnek yolları:

      /images/met/435621.jpg
      /images/aic/123456.jpg
      /images/cma/12345.jpg
      /images/rijks/SK-A-1505.jpg
    */
    function getMuseumFolder(item) {
      const museumValue = firstAvailable(
        item.museum,
        item.museum_code,
        item.museum_id,
        item.source,
        item.museum_name_en,
        item.museum_name_tr,
        item.museum_name
      ).toLowerCase();

      if (
        museumValue === 'met' ||
        museumValue.includes('metropolitan')
      ) {
        return 'met';
      }

      if (
        museumValue === 'aic' ||
        museumValue.includes('art institute of chicago') ||
        museumValue.includes('chicago')
      ) {
        return 'aic';
      }

      if (
        museumValue === 'cma' ||
        museumValue.includes('cleveland')
      ) {
        return 'cma';
      }

      if (
        museumValue === 'rijks' ||
        museumValue === 'rijksmuseum' ||
        museumValue.includes('rijksmuseum')
      ) {
        return 'rijks';
      }

      return museumValue;
    }

    /*
      GÖRSEL ADRESİ ADAYLARINI OLUŞTURUR

      Önce JSON içinde doğrudan görsel yolu varsa onu dener.
      Sonra images/müze/eser-id.jpg yolunu dener.

      JPG çalışmazsa JPEG ve PNG de denenir.
    */
    function getImageCandidates(item) {
      const candidates = [];

      const directImage = firstAvailable(
        item.image_url,
        item.imageUrl,
        item.image,
        item.image_path,
        item.imagePath,
        item.local_image,
        item.localImage
      );

      if (directImage) {
        if (
          directImage.startsWith('http://') ||
          directImage.startsWith('https://')
        ) {
          candidates.push(directImage);
        } else if (directImage.startsWith('/')) {
          candidates.push(
            `${FIREBASE_ROOT}${directImage}`
          );
        } else {
          candidates.push(
            `${FIREBASE_ROOT}/${directImage}`
          );
        }
      }

      const artworkId = getArtworkId(item);
      const museumFolder = getMuseumFolder(item);

      if (artworkId && museumFolder) {
        const safeArtworkId =
          encodeURIComponent(artworkId);

        candidates.push(
          `${FIREBASE_ROOT}/images/${museumFolder}/${safeArtworkId}.jpg`
        );

        candidates.push(
          `${FIREBASE_ROOT}/images/${museumFolder}/${safeArtworkId}.jpeg`
        );

        candidates.push(
          `${FIREBASE_ROOT}/images/${museumFolder}/${safeArtworkId}.png`
        );
      }

      /*
        Aynı adres iki kez oluştuysa tekrarları kaldır.
      */
      return [...new Set(candidates)];
    }

    /*
      ETİKETİ GÖSTERİR VEYA GİZLER
    */
    function setTag(element, value) {
      if (!value) {
        element.textContent = '';
        element.classList.add('hidden');
        return;
      }

      element.textContent = value;
      element.classList.remove('hidden');
    }

    /*
      RASTGELE ESER SEÇER.
      AYNI ESERİN ART ARDA GELMESİNİ ENGELLER.
    */
    function pickRandomArtwork() {
      if (artworks.length === 0) {
        return null;
      }

      let index;

      do {
        index =
          Math.floor(Math.random() * artworks.length);
      } while (
        index === lastIndex &&
        artworks.length > 1
      );

      lastIndex = index;

      return artworks[index];
    }

    /*
      GÖRSEL ADAYLARINI SIRAYLA DENER
    */
    function loadArtworkImage(item) {
      const imageCandidates =
        getImageCandidates(item);

      let imageIndex = 0;

      imgElement.classList.remove('opacity-100');
      imgElement.classList.add('opacity-0');

      imgElement.removeAttribute('src');

      if (imageCandidates.length === 0) {
        console.error(
          'Görsel yolu oluşturulamadı:',
          item
        );

        return;
      }

      function tryNextImage() {
        if (imageIndex >= imageCandidates.length) {
          console.error(
            'Hiçbir görsel adresi yüklenemedi:',
            imageCandidates,
            item
          );

          imgElement.removeAttribute('src');
          return;
        }

        const currentUrl =
          imageCandidates[imageIndex];

        imageIndex += 1;

        console.log(
          'Görsel deneniyor:',
          currentUrl
        );

        imgElement.src = currentUrl;
      }

      imgElement.onload = () => {
        imgElement.classList.remove('opacity-0');
        imgElement.classList.add('opacity-100');
      };

      imgElement.onerror = () => {
        console.warn(
          'Görsel yüklenemedi:',
          imgElement.src
        );

        tryNextImage();
      };

      tryNextImage();
    }

    /*
      SEÇİLEN ESERİ SAYFADA GÖSTERİR
    */
    function showArtwork(item) {
      if (!item) {
        return;
      }

      imgElement.classList.remove('opacity-100');
      imgElement.classList.add('opacity-0');

      setTimeout(() => {
        titleElement.textContent =
          getTitle(item);

        artistElement.textContent =
          getArtist(item);

        descElement.textContent =
          getDescription(item);

        setTag(
          nationalityTag,
          getNationality(item)
        );

        setTag(
          dateTag,
          getDate(item)
        );

        setTag(
          museumTag,
          getMuseum(item)
        );

        loadArtworkImage(item);
      }, 400);
    }

    /*
      YENİ RASTGELE ESER GÖSTERİR
    */
    function loadRandomArtwork() {
      const item =
        pickRandomArtwork();

      showArtwork(item);
    }

    /*
      FIREBASE HOSTING'DEKİ JSON DOSYASINI OKUR
    */
    async function loadHostedArtworks() {
      titleElement.textContent =
        'Yükleniyor…';

      artistElement.textContent =
        '';

      descElement.textContent =
        'Eserler koleksiyondan yükleniyor...';

      setTag(nationalityTag, '');
      setTag(dateTag, '');
      setTag(museumTag, '');

      try {
        const response =
          await fetch(JSON_URL, {
            cache: 'no-store'
          });

        if (!response.ok) {
          throw new Error(
            `JSON alınamadı. HTTP ${response.status}`
          );
        }

        const hostedData =
          await response.json();

        /*
          JSON şu biçimlerden herhangi birinde olabilir:

          1. Doğrudan dizi:
             [ {...}, {...} ]

          2. items alanı:
             { "items": [ {...}, {...} ] }

          3. artworks alanı:
             { "artworks": [ {...}, {...} ] }
        */
        if (Array.isArray(hostedData)) {
          artworks = hostedData;
        } else if (Array.isArray(hostedData.items)) {
          artworks = hostedData.items;
        } else if (Array.isArray(hostedData.artworks)) {
          artworks = hostedData.artworks;
        } else {
          throw new Error(
            'JSON içinde items veya artworks dizisi bulunamadı.'
          );
        }

        artworks = artworks.filter(
          item =>
            item &&
            typeof item === 'object'
        );

        if (artworks.length === 0) {
          throw new Error(
            'Koleksiyonda gösterilecek eser bulunamadı.'
          );
        }

        loadRandomArtwork();

      } catch (error) {
        console.error(error);

        titleElement.textContent =
          'Eserler yüklenemedi';

        artistElement.textContent =
          '';

        descElement.textContent =
          `Hata: ${error.message}`;

        setTag(nationalityTag, '');
        setTag(dateTag, '');
        setTag(museumTag, '');

        imgElement.removeAttribute('src');
      }
    }

    /*
      NEXT BUTONU
    */
    nextBtn.addEventListener(
      'click',
      loadRandomArtwork
    );

    /*
      SAYFA AÇILINCA VERİLERİ YÜKLE
    */
    window.addEventListener(
      'load',
      loadHostedArtworks
    );
  </script>

</body>
</html>
